<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLACKBOX — Local evidence console</title>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">B</span>
      <div>
        <h1>BLACKBOX</h1>
        <p>Local evidence console</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="local-pill"><span class="dot"></span> local only</span>
      <button id="refresh" class="button button-quiet" type="button">Refresh</button>
      <a class="button button-quiet" href="/docs" target="_blank" rel="noreferrer">API docs</a>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" aria-label="Incidents">
      <div class="sidebar-heading">
        <span>Incidents</span>
        <span id="incident-count" class="count">0</span>
      </div>
      <div id="incident-list" class="incident-list"></div>
      <div class="sidebar-footer">
        <p>Evidence is read from the configured local Git repository and SQLite database.</p>
        <p class="muted">No authentication. Keep this server on localhost.</p>
      </div>
    </aside>

    <main id="main" class="main" aria-live="polite">
      <section class="empty-state">
        <div class="eyebrow">Loading</div>
        <h2>Opening the evidence store…</h2>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/ui/app.js"></script>
</body>
</html>
